<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#2a1a5e"/>
      <stop offset="55%" stop-color="#14082e"/>
      <stop offset="100%" stop-color="#07040f"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      stop-color="#f2f5ff" stop-color="#c8d4ff"
    </linearGradient>
    <linearGradient id="hair2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2f5ff"/>
      <stop offset="100%" stop-color="#b9c6f2"/>
    </linearGradient>
    <radialGradient id="eye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d8f6ff"/>
      <stop offset="55%" stop-color="#4fd8ff"/>
      <stop offset="100%" stop-color="#0a6ad8"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- floating cursed energy rings -->
  <circle cx="256" cy="270" r="190" fill="none" stroke="#7b4dff" stroke-opacity="0.35" stroke-width="6"/>
  <circle cx="256" cy="270" r="150" fill="none" stroke="#35c8ff" stroke-opacity="0.28" stroke-width="4"/>

  <!-- hair silhouette -->
  <path d="M256 92 L300 150 L348 118 L352 184 L406 176 L374 226 L424 250 L372 268 L256 268 L140 268 L88 250 L138 226 L106 176 L160 184 L164 118 L212 150 Z" fill="url(#hair2)" filter="url(#glow)"/>

  <!-- face -->
  <rect x="176" y="228" width="160" height="170" rx="62" fill="#f3cba6"/>

  <!-- blindfold -->
  <rect x="168" y="252" width="176" height="46" rx="16" fill="#0b0e1c"/>

  <!-- Six Eyes glow under the blindfold -->
  <g filter="url(#glow)">
    <ellipse cx="218" cy="316" rx="26" ry="15" fill="url(#eye)"/>
    <ellipse cx="294" cy="316" rx="26" ry="15" fill="url(#eye)"/>
  </g>

  <!-- collar -->
  <path d="M170 398 Q256 442 342 398 L342 424 Q256 468 170 424 Z" fill="#1b2440"/>
</svg>
